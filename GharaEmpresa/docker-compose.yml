version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ghara_mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: gharasas_db
      MYSQL_USER: ghara_admin
      MYSQL_PASSWORD: ghara_dev_2026
      MYSQL_ROOT_PASSWORD: ghara_root_2026
    volumes:
      - ghara_mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  ghara_mysqldata:
